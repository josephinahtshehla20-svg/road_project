services:
  db:
    image: postgres:16
    container_name: road_db
    environment:
      POSTGRES_USER: road
      POSTGRES_PASSWORD: road
      POSTGRES_DB: roaddb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U road -d roaddb"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: road_backend
    environment:
      DATABASE_URL: postgresql+psycopg2://road:road@db:5432/roaddb
      SECRET_KEY: local-dev-secret-change-me
      ADMIN_EMAIL: admin@roadsafe.local
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    environment:
      API_URL: http://localhost:8000
    container_name: road_frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
